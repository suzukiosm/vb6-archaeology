name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kit smoke (pipeline + unit tests)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/kit_smoke.py
