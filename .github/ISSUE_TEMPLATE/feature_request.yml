name: 改善提案
description: 抽出・検証・レポートの不足や、新しいツール・コマンドの提案
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This kit is **Visual Basic 6**, not VBA. App-specific logic (one slip format, one Form) stays in the consumer repo `tools/`, not here.

        本キットのゴールは **正確な理解と再現可能な調査**です。対象は VB6 であり VBA ではありません。
        アプリ固有ロジック（特定の伝票形式・特定 Form 等）はキットには入れず、消費者リポの `tools/` に置きます。
        キット保守の未採用案の正は [`docs/kit-improvement-ideas.md`](../docs/kit-improvement-ideas.md)
        （`python -m tools ideas`）。Issue は受付口。採用するまで実装しない。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どの調査ステップで、何が足りないか
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 根拠
      description: 取りこぼした・誤検知した実例（VB6 の構文パターンなど。正本の業務内容は伏せて構いません）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 対象
      options:
        - tools（抽出・解析・検証）
        - .cursor（rules / skills / commands / hooks）
        - docs（方法論・採用手順）
        - その他
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 適用範囲の確認
      options:
        - label: This is useful for any VB6 project, not one app / 特定アプリ固有ではなく、どの VB6 プロジェクトでも役立つ
        - label: This is Visual Basic 6, not VBA / VB6 の話であり VBA ではない
